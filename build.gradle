plugins {
    id 'java-library'
}

group = 'net.zamasoft'
version = '1.1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('processResources').configure {
    filteringCharset = 'UTF-8'
}

dependencies {
    api 'org.htmlunit:neko-htmlunit:4.21.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}


// API documentation in English and in Japanese (javadoc/ja.json), and the GitHub Pages layout: English at the root,
// Japanese under ja/ (javadocPages -> build/pages). See gradle/javadoc-i18n/javadoc-i18n.gradle.
ext.javadocI18n = [
    title     : "html-balancer API ${version}",
    sourceDirs: { [file('src/main/java')] },
    classpath : { sourceSets.main.compileClasspath },
    scope     : 'net.zamasoft.balancer.**',
]
apply from: 'gradle/javadoc-i18n/javadoc-i18n.gradle'
